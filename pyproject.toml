[project]
name = "mylanghello"
version = "0.1.0"
description = "FastAPI + LangGraph demo agent with SQL tools and configurable LLM providers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # --- Web Framework & API Server ---
  "fastapi==0.135.3",               # Web server hosting the agent REST endpoints and backend routes
  "uvicorn[standard]==0.44.0",      # High-performance ASGI server to run the FastAPI app
  "httpx==0.27.0",                  # Async HTTP client for performing API requests and integration testing

  # --- LangChain & Agent Orchestration ---
  "langchain==1.2.15",              # LLM application framework orchestrating prompt templates and tools
  "langchain-community==0.4.1",     # Third-party integrations (e.g. database utilities, tool integrations)
  "langchain-openai==1.1.12",       # OpenAI model integration for the main agent execution
  "langgraph==1.1.6",               # Graph-based state orchestration framework for building agent workflows
  "langserve[all]==0.3.3",          # Exposes the LangGraph agent workflow as runnable FastAPI routes

  # --- Interactive User Interface ---
  "chainlit==2.11.1",               # Interactive web chat interface for local UI testing

  # --- Data Validation & Configuration ---
  "pydantic==2.12.5",               # Data validation schemas for config, messages, and tool arguments
  "pydantic-settings==2.14.1",      # Parse and validate settings variables loaded from the environment
  "python-dotenv==1.2.2",           # Loads environment configurations and secrets from the .env file

  # --- Database Connectivity ---
  "pyodbc==5.3.0",                  # ODBC driver connection wrapper for database tools to query DB

  # --- Logging & Terminal Formatting ---
  "colorama==0.4.6",               # Cross-platform terminal coloring for CLI agent outputs
  "colorlog==6.10.1",               # Colorized log formatting in terminal output

  # --- Monitoring & Metrics ---
  "prometheus-client==0.25",        # Exposes performance metrics and system monitoring endpoints

  # --- Code Quality & Linting ---
  "ruff==0.15.17",                  # Extremely fast linter and formatter to keep code style consistent
  "mypy==2.1.0",                    # Static type analysis to guarantee code type safety
  "types-colorama==0.4.15.20260408",# Type hints for the colorama library to satisfy mypy checks

  # --- Testing ---
  "pytest==9.0.3",                  # Test framework for running automated unit and integration tests
  "pytest-asyncio==1.4.0",          # Support for testing async logic (e.g. async agent step streams)
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "basedpyright>=1.39.7",
]
