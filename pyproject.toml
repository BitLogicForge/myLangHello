readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "colorama==0.4.6",
    "colorlog==6.10.1",
    "fastapi==0.135.3",
    "langchain==1.2.15",
    "langchain-community==0.4.1",
    "langchain-openai==1.1.12",
    "langgraph==1.1.6",
    "langserve[all]==0.3.3",
    "prometheus-client==0.25",
    "pyodbc==5.3.0",
    "pydantic==2.12.5",
    "python-dotenv==1.2.2",
    "requests==2.33.1",
    "types-colorama==0.4.15.20260408",
    "uvicorn[standard]==0.44.0",
]

[tool.uv]
package = false
